# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-arm-marek"
BBFILE_PATTERN_meta-arm-marek = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-arm-marek = "6"

LAYERDEPENDS_meta-arm-marek = "core"
LAYERSERIES_COMPAT_meta-arm-marek = "whinlatter"
