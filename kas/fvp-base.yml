header:
  version: 13

machine: fvp-base
distro: poky

repos:
  bitbake:
    url: https://git.openembedded.org/bitbake
    path: layers/bitbake
    refspec: yocto-5.3.3
    layers:
      .: disabled

  openembedded-core:
    url: https://git.openembedded.org/openembedded-core
    path: layers/openembedded-core
    refspec: fvp-whinlatter
    layers:
      meta:

  meta-yocto:
    url: https://git.yoctoproject.org/meta-yocto
    path: layers/meta-yocto
    refspec: yocto-5.3.3
    layers:
      meta-poky:
      meta-yocto-bsp:

  meta-arm:
    url: https://git.yoctoproject.org/meta-arm
    path: layers/meta-arm
    refspec: fvp-whinlatter
    layers:
      meta-arm:
      meta-arm-bsp:
      meta-arm-toolchain:

  meta-arm-marek:
    url: https://github.com/MarekBykowski/meta-arm-marek.git
    path: layers/meta-arm-marek
    refspec: fvp-whinlatter
    layers:
      .:

local_conf_header:
  base: |
    INHERIT += "fvpboot"
    LICENSE_FLAGS_ACCEPTED = "Arm-FVP-EULA"
    INHIBIT_PACKAGE_STRIP = "1"
    PREFERRED_VERSION_virtual/kernel = "6.16"
    PREFERRED_VERSION_u-boot = "2025.10"
    EXTRA_IMAGE_FEATURES ?= "allow-root-login empty-root-password"
    USER_CLASSES ?= "buildstats"
    PATCHRESOLVE = "noop"
    PACKAGECONFIG:append:pn-qemu-system-native = " sdl"
    CONF_VERSION = "2"

target:
  - core-image-minimal
